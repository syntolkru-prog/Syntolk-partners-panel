name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://syntolk:syntolk@localhost:5432/syntolk_partners
      CLOUDPAYMENTS_API_SECRET: test-secret
      ADMIN_API_KEY: test-admin-key
      SYNTOLK_INTERNAL_API_KEY: test-internal-key
      REFERRAL_IP_HASH_SALT: test-ip-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run check
      - run: npm test
      - run: npm run build
