name: Import Refferq verbatim

on:
  push:
    branches:
      - feature/affiliate-foundation
    paths:
      - .github/workflows/import-refferq-verbatim.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: feature/refferq-full-copy
          fetch-depth: 0
          submodules: false

      - name: Import Refferq tree except workflow file
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove refferq 2>/dev/null || true
          git remote add refferq https://github.com/Refferq/Refferq.git
          git fetch --no-tags refferq main

          git read-tree --reset -u refferq/main

          # GITHUB_TOKEN cannot push changes to workflow files.
          # The one upstream workflow is copied separately via GitHub API.
          rm -rf .github/workflows
          git add -A

          if ! git diff --quiet --cached; then
            git commit -m "chore: import Refferq upstream tree verbatim except workflow"
          fi

          git diff --exit-code refferq/main HEAD -- . ':(exclude).github/workflows/**'
          git push origin HEAD:feature/refferq-full-copy
