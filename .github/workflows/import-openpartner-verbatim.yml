name: Import OpenPartner verbatim

on:
  push:
    branches:
      - ops/import-openpartner
    paths:
      - .github/workflows/import-openpartner-verbatim.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: feature/openpartner-full-copy
          fetch-depth: 0
          submodules: false

      - name: Import OpenPartner tree except workflow files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove openpartner 2>/dev/null || true
          git remote add openpartner https://github.com/getcoherence/openpartner.git
          git fetch --no-tags openpartner main

          git read-tree --reset -u openpartner/main

          # GITHUB_TOKEN cannot push workflow-file changes.
          # Workflows are copied separately through the GitHub API.
          rm -rf .github/workflows
          git add -A

          if ! git diff --quiet --cached; then
            git commit -m "chore: import OpenPartner upstream tree verbatim except workflows"
          fi

          git diff --exit-code openpartner/main HEAD -- . ':(exclude).github/workflows/**'
          git push origin HEAD:feature/openpartner-full-copy
